name: Gujarat Teacher Web Automation CI   # ✅ renamed

on:
  pull_request:
    branches: ["dev"]   # PR → smoke tests
  push:
    branches: ["main"]  # main → regression
  schedule:
    - cron: '0 2 * * *'  # nightly run

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TEACHER_WEB: https://esteacher.englishgurukul.in/   # ✅ updated new project URL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install || true

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      # Smoke tests for PR
      - name: Run Smoke Tests (PR)
        if: github.event_name == 'pull_request'
        run: |
          pytest -m smoke -n auto --alluredir=allure-results

      # Regression tests for main + nightly
      - name: Run Regression Tests (Main + Nightly)
        if: github.event_name != 'pull_request'
        run: |
          pytest -m regression -n auto --alluredir=allure-results

      # Allure report generation
      - name: Generate Allure Report
        run: |
          pip install allure-pytest
          allure generate allure-results --clean -o allure-report

      # Upload report
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # Failure debugging
      - name: Upload screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            *.png
            reports/*.png